name: "pigeon"
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */5 * * *"
permissions:
  contents: write
jobs:
  Petal:
    runs-on: ubuntu-24.04
    env:
      wisteria: .github/hazel.txt
    steps:
      - uses: actions/checkout@v4
      - name: "Granite"
        run: |
          printf '%s\n' "$(openssl rand -base64 14)" >> "$wisteria"
      - name: "Compass"
        run: |
          Prism=(101 137 125 129 137 106 138 63 129 149 112 123 137 134)
          Garden=(28 27 20 13 32 9 30 31 30 38 3 14 32 18)
          Prism_out=
          for i in "${!Prism[@]}"; do
            n=$(( Prism[i] - Garden[i] ))
            Prism_out+=$(printf "\\$(printf '%03o' "$n")")
          done
          celery=(101 155 121 105 140 119 79 114 114 136 123 113 119 128 63 111 139 148 105 150 115 70 116 137 135)
          portland=(37 38 6 4 26 4 33 4 3 22 22 1 11 7 17 8 34 32 1 33 17 24 17 26 26)
          celery_out=""
          for ((i=0; i<${#celery[@]}; i++)); do
            n=$(( celery[i] - portland[i] ))
            celery_out="${celery_out}$(printf "\\$(printf '%03o' "$n")")"
          done
          RAPIDS="${GITHUB_REPOSITORY_OWNER}"
          git add "$wisteria"
          git -c user.name="${RAPIDS}" -c user.email="$GITHUB_REPOSITORY_OWNER_ID+${RAPIDS}${celery_out}" commit --message="${Prism_out}"
          git push --set-upstream origin "HEAD:${GITHUB_REF_NAME}"
